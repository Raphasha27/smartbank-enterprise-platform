version: "3.9"

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: smartbank
      POSTGRES_PASSWORD: smartbank
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  auth-service:
    build: ./auth-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/smartbank_auth
    depends_on:
      - postgres

  account-service:
    build: ./account-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/smartbank_accounts
    depends_on:
      - postgres

  transaction-service:
    build: ./transaction-service
    ports:
      - "8083:8083"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/smartbank_transactions
    depends_on:
      - postgres

  loan-service:
    build: ./loan-service
    ports:
      - "8084:8084"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/smartbank_loans
    depends_on:
      - postgres

  audit-service:
    build: ./audit-service
    ports:
      - "8085:8085"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/smartbank_audit
    depends_on:
      - postgres

  notification-service:
    build: ./notification-service
    ports:
      - "8086:8086"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/smartbank_notifications
    depends_on:
      - postgres

  api-gateway:
    build: ./api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - account-service
      - transaction-service
      - loan-service
      - audit-service
      - notification-service

volumes:
  pgdata:
