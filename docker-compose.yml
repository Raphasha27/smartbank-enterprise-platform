version: "3.9"

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: smartbank
      POSTGRES_PASSWORD: smartbank
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartbank"]
      interval: 5s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

  auth-service:
    build: ./auth-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/smartbank_auth
      - SPRING_DATASOURCE_USERNAME=smartbank
      - SPRING_DATASOURCE_PASSWORD=smartbank
    depends_on:
      postgres:
        condition: service_healthy

  account-service:
    build: ./account-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/smartbank_accounts
      - SPRING_DATASOURCE_USERNAME=smartbank
      - SPRING_DATASOURCE_PASSWORD=smartbank
    depends_on:
      postgres:
        condition: service_healthy

  transaction-service:
    build: ./transaction-service
    ports:
      - "8083:8083"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/smartbank_transactions
      - SPRING_DATASOURCE_USERNAME=smartbank
      - SPRING_DATASOURCE_PASSWORD=smartbank
    depends_on:
      postgres:
        condition: service_healthy

  loan-service:
    build: ./loan-service
    ports:
      - "8084:8084"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/smartbank_loans
      - SPRING_DATASOURCE_USERNAME=smartbank
      - SPRING_DATASOURCE_PASSWORD=smartbank
    depends_on:
      postgres:
        condition: service_healthy

  audit-service:
    build: ./audit-service
    ports:
      - "8085:8085"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/smartbank_audit
      - SPRING_DATASOURCE_USERNAME=smartbank
      - SPRING_DATASOURCE_PASSWORD=smartbank
    depends_on:
      postgres:
        condition: service_healthy

  notification-service:
    build: ./notification-service
    ports:
      - "8086:8086"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/smartbank_notifications
      - SPRING_DATASOURCE_USERNAME=smartbank
      - SPRING_DATASOURCE_PASSWORD=smartbank
    depends_on:
      postgres:
        condition: service_healthy

  api-gateway:
    build: ./api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - account-service
      - transaction-service
      - loan-service
      - audit-service
      - notification-service

volumes:
  pgdata:
