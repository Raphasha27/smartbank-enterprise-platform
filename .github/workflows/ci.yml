name: CI

on: [push, pull_request]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven
      - run: mvn clean compile

  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven
      - run: mvn clean package -DskipTests

      - name: Start infrastructure
        run: |
          docker compose up -d postgres zookeeper kafka
          echo "Waiting for Kafka to be ready..."
          sleep 15

      - name: Start services
        run: |
          for svc in auth-service account-service transaction-service api-gateway; do
            docker compose up -d $svc
          done
          sleep 10

      - name: Run integration smoke tests
        run: |
          echo "=== Health checks ==="
          curl -sf http://localhost:8080/actuator/health && echo " — Gateway UP"
          curl -sf http://localhost:8081/actuator/health && echo " — Auth UP"
          curl -sf http://localhost:8082/actuator/health && echo " — Account UP"
          curl -sf http://localhost:8083/actuator/health && echo " — Transaction UP"

          echo "=== Register user ==="
          curl -s -X POST http://localhost:8080/auth/register \
            -H "Content-Type: application/json" \
            -d '{"name":"IT User","email":"it@test.com","password":"TestPass1!"}'

          echo "=== Login ==="
          TOKEN=$(curl -s -X POST http://localhost:8080/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"it@test.com","password":"TestPass1!"}' | jq -r '.token')

          echo "=== Create accounts ==="
          ACC1=$(curl -s -X POST http://localhost:8080/accounts \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"name":"Sender","email":"it@test.com"}' | jq -r '.id')

          ACC2=$(curl -s -X POST http://localhost:8080/accounts \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"name":"Receiver","email":"it@test.com"}' | jq -r '.id')

          echo "=== Deposit funds ==="
          curl -s -X PUT "http://localhost:8080/accounts/$ACC1/balance?delta=1000" \
            -H "Authorization: Bearer $TOKEN"

          echo "=== Transfer ==="
          RESULT=$(curl -s -X POST http://localhost:8080/transactions/transfer \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -H "Idempotency-Key: it-test-001" \
            -d "{\"fromAccountId\":$ACC1,\"toAccountId\":$ACC2,\"amount\":250.00}")
          STATUS=$(echo "$RESULT" | jq -r '.status')
          echo "Transfer status: $STATUS"
          test "$STATUS" = "COMPLETED" || exit 1

          echo "=== Verify balances ==="
          BAL1=$(curl -s http://localhost:8080/accounts/$ACC1 \
            -H "Authorization: Bearer $TOKEN" | jq -r '.balance')
          BAL2=$(curl -s http://localhost:8080/accounts/$ACC2 \
            -H "Authorization: Bearer $TOKEN" | jq -r '.balance')
          echo "Sender balance: $BAL1 (expected 750)"
          echo "Receiver balance: $BAL2 (expected 250)"
          test "$BAL1" = "750.0" || exit 1
          test "$BAL2" = "250.0" || exit 1

          echo "=== Integration tests PASSED ==="

  docker-build:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven
      - run: mvn clean package -DskipTests

      - name: Build Docker images
        run: |
          for svc in auth-service account-service transaction-service loan-service audit-service notification-service api-gateway; do
            docker build -t smartbank/$svc:latest ./$svc
          done
          echo "All Docker images built successfully"
