server:
  port: 8080
spring:
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/auth/**
        - id: account-service
          uri: http://localhost:8082
          predicates:
            - Path=/accounts/**
        - id: transaction-service
          uri: http://localhost:8083
          predicates:
            - Path=/transactions/**
        - id: loan-service
          uri: http://localhost:8084
          predicates:
            - Path=/loans/**
        - id: audit-service
          uri: http://localhost:8085
          predicates:
            - Path=/audit/**
        - id: notification-service
          uri: http://localhost:8086
          predicates:
            - Path=/notifications/**
  application:
    name: api-gateway
